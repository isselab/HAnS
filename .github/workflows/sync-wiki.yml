name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - '.wiki/wiki/**'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten and sync wiki content
        run: |
          # Remove all existing .md files and subdirs (preserve .git)
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          # Flatten: copy all .md files to wiki-repo root
          # _index.md files are renamed to their parent directory name
          find .wiki/wiki -name "*.md" | while IFS= read -r f; do
            filename=$(basename "$f")
            if [ "$filename" = "_index.md" ]; then
              parent=$(basename "$(dirname "$f")")
              dest="${parent}.md"
            else
              dest="$filename"
            fi
            cp "$f" "wiki-repo/$dest"
          done

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: wiki from ${{ github.repository }}@${{ github.sha }}"
            git push
          fi
